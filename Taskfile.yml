version: '3'

vars:
  BINARY_NAME: cti-agent
  SOURCE_NAME: ./cmd/cti-agent
  INSTALL_PATH: "{{.HOME}}/bin"
  DEV_RUN: ./fleet-kit/bin/dev-run
  LANE_TESTS: ./fleet-kit/tests/test_lanes.py
  FLEET_LOCAL: .fleet-local

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

# ── quality ──────────────────────────────────────────────────────────────────

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any Go file is unformatted
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "unformatted files:"; echo "$unformatted"; exit 1
        fi
        echo "all Go files formatted"

  scan:
    # Named "scan" long before this repo had security tooling. It is
    # staticcheck - correctness and dead code, NOT a vulnerability scan. The
    # security gates are `gosec` and `govulncheck` below.
    desc: Run staticcheck (correctness, not a security scan)
    cmds:
      - staticcheck ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  gosec:
    desc: Run gosec (insecure code patterns)
    # Deliberate exceptions carry an inline "#nosec <RULE> -- reason" with the
    # reason next to the code, rather than a blanket exclusion list here:
    # a suppression whose justification lives in a config file is a
    # suppression nobody will ever re-examine.
    cmds:
      - |
        if ! command -v gosec >/dev/null 2>&1; then
          echo "gosec not installed:" >&2
          echo "  go install github.com/securego/gosec/v2/cmd/gosec@latest" >&2
          exit 1
        fi
        gosec ./...

  gosec:audit:
    desc: "Show what the #nosec annotations are hiding. Advisory - never gates."
    # A suppression nobody re-examines is the failure this repo keeps finding,
    # and #nosec is a suppression. This run ignores every annotation, so the
    # findings they cover are visible and can be re-judged.
    #
    # It also answers a question the normal run cannot: whether an annotation
    # suppresses anything. gosec reported "Nosec: 10, Issues: 1", which is
    # consistent with ten real suppressions - and equally consistent with one
    # real one and nine comments justifying a finding that never fires. An
    # annotation in the second category is worse than none: it reads as a
    # considered exception, and it names a rule ID that will not cover the rule
    # that eventually does fire. That is exactly how G703 got through a
    # "#nosec G304".
    #
    # Compare the two lists. Any annotated line that does NOT appear here is
    # suppressing nothing: delete the #nosec and keep the prose.
    cmds:
      - |
        if ! command -v gosec >/dev/null 2>&1; then
          echo "gosec not installed:" >&2
          echo "  brew install gosec   # or: go install github.com/securego/gosec/v2/cmd/gosec@latest" >&2
          exit 1
        fi
        report="$(mktemp -t gosec-nosec.XXXXXX.json)"
        trap 'rm -f "$report"' EXIT
        echo "== findings with every #nosec annotation IGNORED =="
        gosec -quiet -nosec=true -fmt=text ./... || true
        gosec -quiet -nosec=true -fmt=json -out "$report" ./... >/dev/null 2>&1 || true
        echo
        echo "== are the annotations earning their place? =="
        python3 scripts/nosec-audit.py "$report" || true

  govulncheck:
    desc: Check stdlib and dependencies against the Go vulnerability database
    # This matters more than the empty go.mod suggests. The agent parses
    # untrusted HTML and XML off the public internet with encoding/xml and
    # net/http, so a stdlib advisory in either is a live finding here - and
    # govulncheck reports only vulnerabilities the code actually reaches.
    cmds:
      - |
        if ! command -v govulncheck >/dev/null 2>&1; then
          echo "govulncheck not installed:" >&2
          echo "  go install golang.org/x/vuln/cmd/govulncheck@latest" >&2
          exit 1
        fi
        govulncheck ./...

  tidy:
    desc: Download and tidy Go dependencies
    cmds:
      - go mod tidy

# ── tests ────────────────────────────────────────────────────────────────────

  test:
    desc: Run every test (Go + Python lanes)
    deps: [test:go, test:lanes]

  test:go:
    desc: Run all Go tests
    cmds:
      - go test ./...

  test:graph:
    desc: Graph URL construction, sendMail, and error diagnosis
    cmds:
      - go test ./internal/graph/ -v

  test:report:
    desc: Report writer hostname redaction and file permissions
    cmds:
      - go test ./internal/report/ -v

  test:cve:
    desc: CVE extraction from email text
    cmds:
      - go test ./internal/cti/ -v

  test:budget:
    desc: Quota ceilings, backoff growth, and rate-limit classification
    cmds:
      - go test ./internal/budget/ -v

  test:mailbox:
    desc: Mailbox cleanup - the processed-message gate, precedence, retention
    cmds:
      - go test ./internal/mailbox/ -v

  mailbox:
    desc: "Show what mailbox cleanup WOULD do. Moves nothing."
    # No --for-real here on purpose. A task that modifies a shared mailbox
    # should be typed out in full, not reachable by tab-completing a name.
    cmds:
      - |
        if [ -f ./.env ]; then set -a; . ./.env; set +a; fi
        go run ./cmd/cti-mailbox

  test:patchtuesday:
    desc: Patch Tuesday date maths, source parsing, exposure and QQL
    cmds:
      - go test ./internal/patchtuesday/ -v

  test:safelog:
    desc: The log sanitiser - control characters, rune-safe truncation
    # It is a security control (CWE-117) used by the two lanes that print
    # outside text, so it is tested rather than trusted.
    cmds:
      - go test ./internal/safelog/ -v

  test:env:
    desc: fleet.env parsing and which credentials each command may fail on
    # These two go together: one reads the file, the other decides which names
    # count as required. Getting either wrong produces the same symptom - a
    # lane refusing to run over credentials that are present, or that it never
    # uses - and that symptom has now appeared twice in production.
    cmds:
      - go test ./internal/fleetenv/ ./internal/config/ -v

  ship:
    desc: "Everything, then push. Refuses to push unless all of it passes."
    # Exists because `task test` and `git push` typed as separate lines are not
    # a gate: a red test scrolled past and the push went out anyway. Task stops
    # at the first failing command, so here the ordering is the enforcement
    # rather than something to remember at the end of a long session.
    #
    # Tests run before the analysers: they are the fastest and the most
    # informative, so a broken change should fail on behaviour rather than on
    # a lint rule.
    cmds:
      - task: fmt
      - go build ./...
      - task: test
      - task: lint
      - task: scan
      - task: gosec
      - task: govulncheck
      - git push

  patchtuesday:
    desc: "Build the synopsis without sending. Usage: task patchtuesday MONTH=2026-08"
    # Sources ./.env when present so a local replay can reach the scanner and
    # produce real exposure figures. Explicit rather than built into the
    # binary: a command that harvests credentials from whatever directory it
    # happens to start in is a different thing from one that reads its
    # environment. On the server systemd supplies these via EnvironmentFile.
    #
    # .env is 0600 and gitignored. --dry-run cannot send, so this is safe to
    # run with live credentials; it prints host names, so do not paste the
    # output anywhere you would not paste a scan report.
    cmds:
      - |
        # if/fi, not `[ -f ] && .`: a missing .env makes the && chain exit 1
        # and Task treats that as a failed step, so the absence of an optional
        # file would look like a broken task.
        if [ -f ./.env ]; then set -a; . ./.env; set +a; fi
        go run ./cmd/cti-patchtuesday --dry-run{{if .MONTH}} --month {{.MONTH}}{{end}}

  test:kev:
    desc: KEV deadline bands, sign convention, and present-only filtering
    cmds:
      - go test ./internal/kev/ -v

  kev:
    desc: CISA KEV remediation deadlines for what is actually in the estate
    cmds:
      - |
        # Newest by filename: the names carry an ISO date, so lexical order is
        # chronological and a file touched by a backup does not become "newest".
        enriched=$(ls {{.FLEET_LOCAL}}/state/enriched-*.json 2>/dev/null | sort | tail -1)
        if [ -z "$enriched" ]; then
          echo "no enriched file yet - run: task dev:enrich"; exit 1
        fi
        go run ./cmd/cti-kev --enriched "$enriched" --hosts

  budget:status:
    desc: What the heartbeat's quota ledger would decide right now
    cmds:
      - go run ./cmd/cti-budget status

  test:lanes:
    desc: Python lanes - priority truth table, parsing, digest, mailer gate
    cmds:
      - python3 {{.LANE_TESTS}}

  test:lanes:v:
    desc: Python lane tests, verbose
    cmds:
      - python3 {{.LANE_TESTS}} -v

  test:syntax:
    desc: Byte-compile the lanes and shell-check the fleet scripts
    cmds:
      - |
        set -e
        for f in fleet-kit/fleet/lanes/*.py fleet-kit/fleet/bin/fleet-db; do
          python3 -c "import ast,sys; ast.parse(open('$f').read())"
          echo "  ok  $f"
        done
        for f in fleet-kit/fleet/bin/fleet-board \
                 fleet-kit/fleet/bin/run-digest \
                 fleet-kit/fleet/bin/run-checkin \
                 fleet-kit/fleet/bin/run-patchtuesday \
                 fleet-kit/bin/dev-run \
                 fleet-kit/install.sh \
                 fleet-kit/install-fedora.sh \
                 scripts/scrub-history.sh \
                 scripts/run-local.sh; do
          bash -n "$f" && echo "  ok  $f"
        done
      - |
        python3 - <<'PY'
        import configparser, glob, sys
        bad = 0
        # Both layouts. The glob used to be systemd/* only, so a broken
        # Fedora unit would have sailed through CI.
        for u in sorted(glob.glob("fleet-kit/fleet/systemd*/*")):
            c = configparser.ConfigParser(strict=False, allow_no_value=True)
            try:
                c.read(u)
                if not c.sections():
                    print(f"  EMPTY {u}"); bad += 1
                else:
                    print(f"  ok  {u}")
            except Exception as e:
                print(f"  BAD  {u}: {e}"); bad += 1
        sys.exit(1 if bad else 0)
        PY

  check:
    desc: Everything CI should run - format, vet, security, all tests, syntax
    # Kept in step with `ship`. A push gate that is stricter than CI means the
    # build passes and the push is refused, or worse, the reverse.
    cmds:
      - task: fmt:check
      - task: vet
      - task: test:go
      - task: test:lanes
      - task: test:syntax
      - task: lint
      - task: scan
      - task: gosec
      - task: govulncheck

# ── build ────────────────────────────────────────────────────────────────────

  build:
    desc: Build all six binaries (agent, alerter, quota ledger, KEV, Patch Tuesday, mailbox)
    deps: [tidy]
    cmds:
      - mkdir -p bin
      - go build -o bin/{{.BINARY_NAME}} {{.SOURCE_NAME}}
      - go build -o bin/cti-alert ./cmd/cti-alert
      - go build -o bin/cti-budget ./cmd/cti-budget
      - go build -o bin/cti-kev ./cmd/cti-kev
      - go build -o bin/cti-patchtuesday ./cmd/cti-patchtuesday
      - go build -o bin/cti-mailbox ./cmd/cti-mailbox

  run:
    desc: Run the agent locally using environment variables
    cmds:
      - go run {{.SOURCE_NAME}}

  install:
    desc: Install binary into ~/bin
    deps: [build]
    cmds:
      - mkdir -p {{.INSTALL_PATH}}
      - cp bin/{{.BINARY_NAME}} {{.INSTALL_PATH}}/{{.BINARY_NAME}}

# ── local pipeline (only dev:send:real sends email) ──────────────────────────

  dev:doctor:
    desc: Check tools, .env completeness, Graph token and granted app roles
    cmds:
      - "{{.DEV_RUN}} doctor"

  dev:ingest:none:
    desc: Read the mailbox with NO scanner - isolates Graph and CVE extraction
    cmds:
      - "{{.DEV_RUN}} ingest --provider none"

  dev:ingest:
    desc: Read the mailbox and look CVEs up in the configured scanner
    cmds:
      - "{{.DEV_RUN}} ingest"

  dev:enrich:
    desc: Add NVD CVSS, EPSS and CISA KEV, then assign Sev5-Sev1
    cmds:
      - "{{.DEV_RUN}} enrich"

  dev:brief:
    desc: Render the digest and print a plain-text preview
    cmds:
      - "{{.DEV_RUN}} brief"

  dev:all:
    desc: Full local pipeline, then open the digest. Sends nothing.
    cmds:
      - "{{.DEV_RUN}} all"

  dev:send:
    desc: DRY RUN the digest send - validates the gate and payload, sends nothing
    cmds:
      - '{{.DEV_RUN}} send{{if .TO}} --to {{.TO}}{{end}}'

  dev:send:real:
    desc: "ACTUALLY send the digest. Usage: task dev:send:real TO=you@example.com"
    cmds:
      - |
        if [ -z "{{.TO}}" ]; then
          echo "TO= is required, so a real send is never a typo away."
          echo "  task dev:send:real TO=you@example.com"
          exit 1
        fi
      - '{{.DEV_RUN}} send --to {{.TO}} --for-real'

  dev:report:
    desc: Show the latest local report and enriched priority counts
    cmds:
      - |
        latest=$(ls -t {{.FLEET_LOCAL}}/reports/raw-*.md 2>/dev/null | head -1)
        if [ -z "$latest" ]; then echo "no local report yet - run: task dev:ingest:none"; exit 1; fi
        echo "== $latest"
        head -12 "$latest"
        echo
        enriched=$(ls -t {{.FLEET_LOCAL}}/state/enriched-*.json 2>/dev/null | head -1)
        if [ -n "$enriched" ]; then
          python3 -c "
        import json,sys
        d=json.load(open('$enriched'))
        print('== priorities:', d['counts'], 'total', d['total'])
        if d.get('degraded'): print('== DEGRADED:', ', '.join(d['degraded']))
        for f in d['findings'][:10]:
            print(f\"   {f['priority']}  {f['cve']:<17} {f.get('status','?'):<12} {f.get('host_count',0):>4} host(s)\")"
        fi

  dev:clean:
    desc: Wipe local pipeline state (reports, digests, caches, sqlite)
    cmds:
      - rm -rf {{.FLEET_LOCAL}}
      - echo "removed {{.FLEET_LOCAL}}"

# ── housekeeping ─────────────────────────────────────────────────────────────

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin dist cti-agent

  clean:all:
    desc: Remove build artifacts and local pipeline state
    deps: [clean, dev:clean]
