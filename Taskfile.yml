version: '3'

vars:
  BINARY_NAME: cti-agent
  SOURCE_NAME: cmd/cti-qualys-agent
  INSTALL_PATH: "{{.HOME}}/bin"

tasks:
  default:
    desc: Show available tasks
    cmds: task --list

  scan:
    desc: Run staticcheck
    cmds:
      - staticcheck {{.SOURCE_NAME}}

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run {{.SOURCE_NAME}}

  tidy:
    desc: Download and tidy Go dependencies
    cmds:
      - go mod tidy

  build:
    desc: Build the agent
    deps: [tidy]
    cmds:
      - mkdir -p bin
      - go build -o {{.BINARY_NAME}} {{.SOURCE_NAME}}

  run:
    desc: Run the agent locally using environment variables
    cmds:
      - go run {{.BINARY_NAME}}

  lint:
    desc: Run basic Go checks
    cmds:
      - go vet ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin dist
