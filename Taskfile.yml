version: '3'

vars:
  BINARY_NAME: cti-agent
  SOURCE_NAME: ./cmd/cti-qualys-agent
  INSTALL_PATH: "{{.HOME}}/bin"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  scan:
    desc: Run staticcheck
    cmds:
      - staticcheck ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Download and tidy Go dependencies
    cmds:
      - go mod tidy

  test:
    desc: Run tests
    cmds:
      - go test ./...

  build:
    desc: Build the agent
    deps: [tidy]
    cmds:
      - mkdir -p bin
      - go build -o bin/{{.BINARY_NAME}} {{.SOURCE_NAME}}

  run:
    desc: Run the agent locally using environment variables
    cmds:
      - go run {{.SOURCE_NAME}}

  install:
    desc: Install binary into ~/bin
    deps: [build]
    cmds:
      - mkdir -p {{.INSTALL_PATH}}
      - cp bin/{{.BINARY_NAME}} {{.INSTALL_PATH}}/{{.BINARY_NAME}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin dist
