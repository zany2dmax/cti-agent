# The checkin lane. docs/lane-manifest.md has the schema; scripts/lanes --write
# generates its systemd unit(s) from this file. Edit here, never the unit.
lane = "checkin"
handles = []
summary = "The orchestrator's heartbeat: one /checkin beat of the Claude Code agent that watches the other lanes."
# Settings whose names start with these live in this lane's fleet.d file
# (scripts/settings-manifest); the longest matching prefix wins.
setting_prefixes = ["CHECKIN_", "FLEET_BUDGET_"]
# Its credcheck unit runs every lane's credential check, and the beat reads
# what every lane did, so this lane loads every lane's settings file.
all_settings = true
# The fleet-wide logins, checked daily by run-credcheck with each lane's own.
credential_checks = ["cti-mailer", "cti-jira"]

# What the beat may run (run-checkin's ALLOWED_TOOLS): the fleet-wide tools.
# Bash(x) is $FLEET_CODE/bin/x, Read(d/**) is $FLEET_HOME/d. Each lane
# declares the ones it adds; scripts/lanes --check fails on any difference.
beat_grants = [
  "Bash(fleet-board say:*)",
  "Bash(fleet-board read:*)",
  "Bash(fleet-board tail:*)",
  "Bash(fleet-board resolve:*)",
  "Bash(fleet-board expire:*)",
  "Bash(fleet-db recent:*)",
  "Bash(fleet-db findings:*)",
  "Bash(fleet-db was-sent:*)",
  "Bash(fleet-db rollup:*)",
  "Bash(fleet-db remember:*)",
  "Bash(fleet-db task:*)",
  "Bash(fleet-db mail:*)",
  "Bash(fleet-db ack:*)",
  "Bash(fleet-db vacuum:*)",
  "Bash(cti-budget status:*)",
  "Bash(cti-kev:*)",
  "Bash(fleet-timers:*)",
  "Bash(cti-alert:*)",
  "Bash(fleet-journal:*)",
  "Read(reports/**)",
  "Read(logs/**)",
  "Read(archive/**)",
]

[[unit]]
name = "checkin"
description = "CTI orchestrator heartbeat (one /checkin beat)"
exec = "/opt/cti-agent/bin/run-checkin --for-real"
timeout = 1800
nice = 15
# The orchestrator reads the system journal through fleet-journal.
extra = """
# The orchestrator is allowed to run journalctl, and without this it
# would be allowed to run a command that returns nothing: reading the
# SYSTEM journal needs group membership, not just execute permission.
# cti-agent-alert@.service already had this; the heartbeat did not, so
# journalctl stayed "blocked" even after the tool allowlist landed.
SupplementaryGroups=systemd-journal
"""

[unit.timer]
description = "CTI orchestrator heartbeat every 2 hours"
on_boot = "5min"
on_unit_active = "2h"
persistent = false

# The credential checks the check-in reads: its own unit, so their secrets are
# not in the beat's (run-credcheck). Read-only; writes reports/credcheck.txt.
[[unit]]
name = "credcheck"
description = "CTI credential checks (would each lane get past its logins?)"
exec = "/opt/cti-agent/bin/run-credcheck"
timeout = 900
nice = 15

[unit.timer]
description = "CTI credential checks, daily 05:30"
on_calendar = "*-*-* 05:30:00"
persistent = true
