# The patchtuesday lane. docs/lane-manifest.md has the schema; scripts/lanes --write
# generates its systemd unit(s) from this file. Edit here, never the unit.
lane = "patchtuesday"
handles = ["@patchtuesday"]
summary = "The monthly Microsoft Patch Tuesday synopsis, with exposure on our hosts. Run by hand for now; its timer is off on purpose."
# No lane health report yet (internal/health, docs/lane-manifest.md).
health_exempt = "planned for 2.1: a month whose synopsis was not sent"

# The orchestrator's lane table row (fleet-kit/fleet/CLAUDE.md, generated).
[orchestrator]
order = 3
runs = "`$FLEET_CODE/bin/run-patchtuesday`"
when = "Monthly, by hand (`cti-agent-patchtuesday.timer` is off on purpose)"
sends_to = "`$DIGEST_TO`"

[[unit]]
name = "patchtuesday"
description = "CTI monthly Microsoft Patch Tuesday synopsis"
exec = "/opt/cti-agent/bin/run-patchtuesday --for-real"
timeout = 1800
nice = 10
audit_log = true

[unit.timer]
description = "Monthly Patch Tuesday synopsis, the morning after"
on_calendar = "Wed *-*-09..15 07:30:00"
persistent = true
