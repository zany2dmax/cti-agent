# The digest lane. docs/lane-manifest.md has the schema; scripts/lanes --write
# generates its systemd unit(s) from this file. Edit here, never the unit.
lane = "digest"
handles = ["@ingest", "@enrich", "@brief"]
summary = "The daily threat-intel digest: read the CTI mail, enrich every CVE with exposure on our hosts, and send the brief; on Mondays, the weekly rollup."
# No lane health report yet (internal/health, docs/lane-manifest.md).
health_exempt = "planned for 2.1: the advisory mail read and the CVEs the scanner could not map"
# Settings whose names start with these live in this lane's fleet.d file
# (scripts/settings-manifest); the longest matching prefix wins.
setting_prefixes = ["DIGEST_CC", "DIGEST_SKIP_SUBJECTS", "VM_ALLOW_TO", "FLEET_ALLOW_TO", "TRIAGE_"]

# The orchestrator's lane table row (fleet-kit/fleet/CLAUDE.md, generated).
[orchestrator]
order = 1
runs = "`$FLEET_CODE/bin/run-digest`: `cti-agent`, `cti-enrich`, `cti-brief` (all Go)"
when = "Daily 06:00 (`cti-agent-digest.timer`), Monday weekly (`cti-agent-weekly.timer`)"
sends_to = "`$DIGEST_TO`"

[[unit]]
name = "digest"
description = "CTI daily digest (ingest, enrich, brief, send)"
exec = "/opt/cti-agent/bin/run-digest daily --for-real"
timeout = 3600
nice = 10
audit_log = true

[unit.timer]
description = "Daily CTI digest at 06:00 local"
on_calendar = "*-*-* 06:00:00"
persistent = true

[[unit]]
name = "weekly"
description = "CTI weekly rollup"
exec = "/opt/cti-agent/bin/run-digest weekly --for-real"
timeout = 3600
nice = 10
audit_log = true

[unit.timer]
description = "Weekly CTI rollup, Monday 07:00 local"
on_calendar = "Mon *-*-* 07:00:00"
persistent = true
