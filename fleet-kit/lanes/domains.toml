# The domains lane. docs/lane-manifest.md has the schema; scripts/lanes --write
# generates its systemd unit(s) from this file. Edit here, never the unit.
lane = "domains"
handles = ["@domains"]
summary = "The weekly domains check: registrar, DNS, web and mail records, plus one Jira ticket for IT."
# Settings whose names start with these live in this lane's fleet.d file
# (scripts/settings-manifest); the longest matching prefix wins.
setting_prefixes = ["DOMAINS_", "DOM_", "PROOFPOINT_POD_", "JIRA_DOMAINS_"]

# Run daily by run-credcheck (the checkin lane's credcheck unit), which
# writes the result where the beat reads it: would this lane get past its logins?
credential_checks = ["cti-domains"]

# The orchestrator's lane table row (fleet-kit/fleet/CLAUDE.md, generated).
[orchestrator]
order = 6
runs = "`$FLEET_CODE/bin/run-domains`"
when = "Tuesdays 08:00 (`cti-agent-domains.timer`)"
sends_to = "`$DOM_TO`, plus one Jira ticket for IT"

[[unit]]
name = "domains"
description = "CTI weekly domains check (registrar, DNS, web, mail records)"
exec = "/opt/cti-agent/bin/run-domains --for-real"
timeout = 3600
nice = 10
audit_log = true

[unit.timer]
description = "Weekly domains check, Tuesday 08:00 local"
on_calendar = "Tue *-*-* 08:00:00"
persistent = true
