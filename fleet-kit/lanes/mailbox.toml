# The mailbox lane. docs/lane-manifest.md has the schema; scripts/lanes --write
# generates its systemd unit(s) from this file. Edit here, never the unit.
lane = "mailbox"
handles = ["@mailbox"]
summary = "Mailbox housekeeping: file processed advisories away after the digest has read them."

# The orchestrator's lane table row (fleet-kit/fleet/CLAUDE.md, generated).
[orchestrator]
order = 9
runs = "`$FLEET_CODE/bin/run-mailbox-cleanup`"
when = "Daily 07:00 (`cti-agent-mailbox.timer`)"
sends_to = "nobody: moves mail"

[[unit]]
name = "mailbox"
description = "CTI mailbox cleanup (archive processed, delete auto-replies)"
exec = "/opt/cti-agent/bin/run-mailbox-cleanup --for-real"
timeout = 600
nice = 10
audit_log = true

[unit.timer]
description = "CTI mailbox cleanup, once a day after the digest"
on_calendar = "*-*-* 07:00:00"
persistent = false
