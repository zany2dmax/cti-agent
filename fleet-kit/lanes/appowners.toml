# The appowners lane. docs/lane-manifest.md has the schema; scripts/lanes --write
# generates its systemd unit(s) from this file. Edit here, never the unit.
lane = "appowners"
handles = ["@appowners"]
summary = "Each application's scan report, sent to its owners the morning after the scan."
# No lane health report yet (internal/health, docs/lane-manifest.md).
health_exempt = "covered by the appscan lane's health report: its audit lists each web app's last owner report"
# Settings whose names start with these live in this lane's fleet.d file
# (scripts/settings-manifest); the longest matching prefix wins.
setting_prefixes = ["WAS_OWNER_CC", "OWNER_ALLOW_DOMAINS"]

# The orchestrator's lane table row (fleet-kit/fleet/CLAUDE.md, generated).
[orchestrator]
order = 5
runs = "`$FLEET_CODE/bin/run-appowners`"
when = "Daily 07:15 (`cti-agent-appowners.timer`)"
sends_to = "each application's owners and watchers"

[[unit]]
name = "appowners"
description = "CTI application scan reports to their owners, daily"
exec = "/opt/cti-agent/bin/run-appowners --for-real"
timeout = 3600
nice = 10
audit_log = true

[unit.timer]
description = "Application scan reports to their owners, daily 07:15"
on_calendar = "*-*-* 07:15:00"
persistent = true
