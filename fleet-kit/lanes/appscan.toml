# The appscan lane. docs/lane-manifest.md has the schema; scripts/lanes --write
# generates its systemd unit(s) from this file. Edit here, never the unit.
lane = "appscan"
handles = ["@appscan"]
summary = "The weekly application-security report from the web app scanner's results, with Jira tickets per application."
# Settings whose names start with these live in this lane's fleet.d file
# (scripts/settings-manifest); the longest matching prefix wins.
setting_prefixes = ["WAS_", "APPSCAN_"]

# Run daily by run-credcheck (the checkin lane's credcheck unit), which
# writes the result where the beat reads it: would this lane get past its logins?
credential_checks = ["cti-appreport"]

# The orchestrator's lane table row (fleet-kit/fleet/CLAUDE.md, generated).
[orchestrator]
order = 4
runs = "`$FLEET_CODE/bin/run-appscan`"
when = "Fridays (`cti-agent-appscan.timer`)"
sends_to = "`$WAS_TO`"

[[unit]]
name = "appscan"
description = "CTI application-security weekly report"
exec = "/opt/cti-agent/bin/run-appscan --for-real"
timeout = 3600
nice = 10
audit_log = true

[unit.timer]
description = "Weekly application-security report, Friday 07:30 local"
on_calendar = "Fri *-*-* 07:30:00"
persistent = true
