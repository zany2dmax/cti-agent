# The supplier lane. docs/lane-manifest.md has the schema; scripts/lanes --write
# generates its systemd unit(s) from this file. Edit here, never the unit.
lane = "supplier"
handles = ["@supplier"]
summary = "Supplier requests from the supplier mailbox, judged for third-party risk, with Jira Kanban items."
# Settings whose names start with these live in this lane's fleet.d file
# (scripts/settings-manifest); the longest matching prefix wins.
setting_prefixes = ["SUPPLIER_"]

# The orchestrator's lane table row (fleet-kit/fleet/CLAUDE.md, generated).
[orchestrator]
order = 8
runs = "`$FLEET_CODE/bin/run-supplier`"
when = "Daily 07:45 UTC (`cti-agent-supplier.timer`)"
sends_to = "`$SUPPLIER_TO`, plus Jira Kanban items"

[[unit]]
name = "supplier"
description = "CTI supplier-request lane (judge each new supplier request, file Kanban items, email one digest)"
exec = "/opt/cti-agent/bin/run-supplier --for-real"
timeout = 1800
nice = 10
audit_log = true

[unit.timer]
description = "Supplier-request lane, daily 07:45 local"
on_calendar = "*-*-* 07:45:00"
persistent = true
